[mod]
id = "closet"
version = "1.0.0"
priority = 100

# Reads the action bar and decides glowing (game internals): pinned to the
# commit it was built against.
[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "closet"
source = "runtime.rs"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "frame"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_frame"
helper = "frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The monsters that keep the player awake glow (Minecraft.shouldEntityAppearGlowing).
[[injection]]
id = "glow"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::glowing::Game<'_>::mob_outline"
helper = "glow.rs"
bindings = [
  { name = "m", ty = "&horizon_client::mobs::Mob", value = "m" },
]
